<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resultados — Bodegas Margarinas</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
const firebaseConfig = {
  apiKey: "AIzaSyOm-PHUKhm_1PBiewGzNVnYERgz_bVbOnA",
  authDomain: "temperatura-bodegas.firebaseapp.com",
  databaseURL: "https://temperatura-bodegas-default-rtdb.firebaseio.com",
  projectId: "temperatura-bodegas",
  storageBucket: "temperatura-bodegas.firebasestorage.app",
  messagingSenderId: "365970465101",
  appId: "1:365970465101:web:f5d1b75d1a470e881a1704"
};
const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);
window._fb = { db, ref, onValue };
window.dispatchEvent(new Event('fb-ready'));
</script>
<style>
:root{
  --azul:#0f2d4a;--azul-c:#1a5276;--azul-l:#e8f0f7;
  --verde:#0a4a3a;--acento:#1abc9c;--acento-l:#eafaf6;
  --gris:#f4f6f7;--borde:#d5d8dc;--texto:#17202a;--muted:#5d6d7e;--radio:8px;
  --s1:#3266ad; --s2:#e07b2a;
  --s1-l:#eef3fb; --s2-l:#fdf3ea;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#eaecee;color:var(--texto);min-height:100vh;}
.top-bar{background:var(--azul);color:white;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.2);position:sticky;top:0;z-index:100;}
.top-bar h1{font-size:17px;font-weight:700;}
.top-bar p{font-size:11px;opacity:.55;margin-top:2px;text-transform:uppercase;letter-spacing:.5px;}
.sync-badge{display:flex;align-items:center;gap:6px;font-size:12px;color:rgba(255,255,255,.6);}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#aaa;flex-shrink:0;}
.sync-dot.on{background:var(--acento);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.page{max-width:1000px;margin:0 auto;padding:28px 16px 60px;}

/* SECCIÓN TÍTULO BODEGA */
.bod-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;margin-top:8px;}
.bod-header h2{font-size:17px;font-weight:700;color:var(--azul);}
.bod-divider{flex:1;height:1px;background:var(--borde);}

/* GRÁFICA COMPARATIVA */
.chart-card{background:white;border:1px solid var(--borde);border-radius:14px;padding:20px 24px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.chart-card-title{font-size:14px;font-weight:700;color:var(--azul);margin-bottom:4px;}
.chart-card-sub{font-size:12px;color:var(--muted);margin-bottom:14px;}
.legend-row{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:12px;}
.leg-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);}
.leg-line{width:22px;height:3px;border-radius:2px;}
.leg-dash{width:22px;height:0;border-top:2px dashed;}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-bottom:12px;}
.controls label{font-size:12px;color:var(--muted);}
.controls select{font-size:12px;padding:5px 10px;border:1px solid var(--borde);border-radius:var(--radio);background:white;color:var(--texto);cursor:pointer;}
.chart-wrap{position:relative;width:100%;height:300px;}
.range-label{font-size:11px;color:var(--muted);text-align:center;margin-top:8px;}

/* MÉTRICAS POR SENSOR */
.metrics-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
.sensor-metrics{border-radius:10px;padding:14px 16px;border:1px solid;}
.sensor-metrics.s1{background:var(--s1-l);border-color:var(--s1);}
.sensor-metrics.s2{background:var(--s2-l);border-color:var(--s2);}
.sm-header{font-size:12px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.sm-header.s1{color:var(--s1);}
.sm-header.s2{color:var(--s2);}
.sm-dot{width:10px;height:10px;border-radius:50%;}
.sm-dot.s1{background:var(--s1);}
.sm-dot.s2{background:var(--s2);}
.sm-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.sm-item{background:white;border-radius:6px;padding:8px 10px;text-align:center;}
.sm-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px;}
.sm-val{font-size:16px;font-weight:700;}

/* TABLA */
.tbl-card{background:white;border:1px solid var(--borde);border-radius:14px;padding:20px 24px;margin-bottom:28px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.tbl-card-title{font-size:14px;font-weight:700;color:var(--azul);margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.tabs-tbl{display:flex;gap:6px;margin-bottom:14px;background:var(--gris);border-radius:var(--radio);padding:3px;}
.tab-tbl{flex:1;padding:7px;border:none;border-radius:6px;background:transparent;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);transition:all .15s;text-align:center;}
.tab-tbl.active-s1{background:var(--s1);color:white;}
.tab-tbl.active-s2{background:var(--s2);color:white;}
.tbl-panel{display:none;}
.tbl-panel.active{display:block;}
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{padding:7px 10px;text-align:left;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;border-bottom:2px solid var(--borde);white-space:nowrap;}
tbody td{padding:7px 10px;border-bottom:1px solid #f0f0ee;}
tbody tr:hover{background:var(--gris);}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px;}
.badge-t{background:#fdecea;color:#7b241c;border:1px solid #f1948a;}
.badge-h{background:var(--acento-l);color:var(--verde);border:1px solid #76d7c4;}

.empty-card{background:white;border:2px dashed var(--borde);border-radius:14px;padding:36px;text-align:center;margin-bottom:28px;}
.empty-card strong{display:block;font-size:15px;margin-bottom:6px;}
.empty-card p{color:var(--muted);font-size:13px;}

@media(max-width:580px){
  .metrics-grid{grid-template-columns:1fr;}
  .sm-row{grid-template-columns:repeat(3,1fr);}
  .controls{flex-direction:column;align-items:flex-start;}
}
</style>
</head>
<body>
<div class="top-bar">
  <div>
    <h1>📊 Resultados — Bodegas Margarinas</h1>
    <p>Sensor 1 vs Sensor 2 · Tiempo real</p>
  </div>
  <div class="sync-badge">
    <div class="sync-dot" id="sync-dot"></div>
    <span id="sync-txt">conectando...</span>
  </div>
</div>

<div class="page">
  <div id="vis-b1"></div>
  <div id="vis-b2"></div>
</div>

<script>
const T_MAX=18, T_MIN=16, Y_MIN=14, Y_MAX=26;
const charts={};
let dbData={ b1:{s1:{},s2:{}}, b2:{s1:{},s2:{}} };

window.addEventListener('fb-ready',()=>{
  const {db,ref,onValue}=window._fb;
  document.getElementById('sync-dot').classList.add('on');
  document.getElementById('sync-txt').textContent='en línea';
  ['b1','b2'].forEach(b=>['s1','s2'].forEach(s=>{
    onValue(ref(db,`lecturas/${b}/${s}`),snap=>{
      dbData[b][s]=snap.val()||{};
      renderBodega(b);
    });
  }));
});

function fmtF(f){if(!f)return'';const p=f.split('-');return p.length===3?p[2]+'/'+p[1]:f;}

function getSorted(b,s){
  return Object.values(dbData[b][s]||{}).sort((a,c)=>a.ts-c.ts);
}

function renderBodega(b){
  const num=b==='b1'?'1':'2';
  const d1=getSorted(b,'s1'), d2=getSorted(b,'s2');
  const el=document.getElementById('vis-'+b);

  if(!d1.length && !d2.length){
    el.innerHTML=`<div class="empty-card"><strong>Bodega #${num} — sin datos</strong><p>Los datos aparecerán aquí en tiempo real cuando se ingresen lecturas.</p></div>`;
    return;
  }

  // Fechas únicas combinadas
  const allFechas=[...new Set([...d1,...d2].map(r=>r.fecha))].sort();
  const prevFrom=document.getElementById(`vfrom-${b}`)?.value;
  const prevTo=document.getElementById(`vto-${b}`)?.value;

  el.innerHTML=`
  <!-- ENCABEZADO BODEGA -->
  <div class="bod-header">
    <h2>🏭 Bodega #${num}</h2>
    <div class="bod-divider"></div>
  </div>

  <!-- MÉTRICAS POR SENSOR -->
  <div class="metrics-grid">
    <div class="sensor-metrics s1" id="met-${b}-s1">
      <div class="sm-header s1"><div class="sm-dot s1"></div>Sensor 1</div>
      <div class="sm-row">
        <div class="sm-item"><div class="sm-lbl">Mínima</div><div class="sm-val" id="min-${b}-s1" style="color:#185FA5">—</div></div>
        <div class="sm-item"><div class="sm-lbl">Máxima</div><div class="sm-val" id="max-${b}-s1" style="color:#A32D2D">—</div></div>
        <div class="sm-item"><div class="sm-lbl">Promedio</div><div class="sm-val" id="avg-${b}-s1">—</div></div>
      </div>
    </div>
    <div class="sensor-metrics s2" id="met-${b}-s2">
      <div class="sm-header s2"><div class="sm-dot s2"></div>Sensor 2</div>
      <div class="sm-row">
        <div class="sm-item"><div class="sm-lbl">Mínima</div><div class="sm-val" id="min-${b}-s2" style="color:#185FA5">—</div></div>
        <div class="sm-item"><div class="sm-lbl">Máxima</div><div class="sm-val" id="max-${b}-s2" style="color:#A32D2D">—</div></div>
        <div class="sm-item"><div class="sm-lbl">Promedio</div><div class="sm-val" id="avg-${b}-s2">—</div></div>
      </div>
    </div>
  </div>

  <!-- GRÁFICA COMPARATIVA -->
  <div class="chart-card">
    <div class="chart-card-title">Temperatura — Sensor 1 vs Sensor 2</div>
    <div class="chart-card-sub" id="csub-${b}">Bodega #${num}</div>
    <div class="legend-row">
      <div class="leg-item"><div class="leg-line" style="background:#3266ad"></div>Sensor 1</div>
      <div class="leg-item"><div class="leg-line" style="background:#e07b2a"></div>Sensor 2</div>
      <div class="leg-item"><div class="leg-dash" style="border-color:#E24B4A"></div>Máx. 18°C</div>
      <div class="leg-item"><div class="leg-dash" style="border-color:#185FA5"></div>Mín. 16°C</div>
    </div>
    <div class="controls">
      <label>Desde:</label><select id="vfrom-${b}"></select>
      <label>Hasta:</label><select id="vto-${b}"></select>
    </div>
    <div class="chart-wrap"><canvas id="vchart-${b}"></canvas></div>
    <p class="range-label" id="vrl-${b}"></p>
  </div>

  <!-- TABLA DE REGISTROS -->
  <div class="tbl-card">
    <div class="tbl-card-title">📋 Tabla de registros — Bodega #${num}</div>
    <div class="tabs-tbl">
      <button class="tab-tbl active-s1" id="ttab-${b}-s1" onclick="switchTbl('${b}','s1')">● Sensor 1 (${d1.length})</button>
      <button class="tab-tbl" id="ttab-${b}-s2" onclick="switchTbl('${b}','s2')">● Sensor 2 (${d2.length})</button>
    </div>
    <div class="tbl-panel active" id="tpanel-${b}-s1">
      <div class="tbl-wrap" id="twrap-${b}-s1"></div>
    </div>
    <div class="tbl-panel" id="tpanel-${b}-s2">
      <div class="tbl-wrap" id="twrap-${b}-s2"></div>
    </div>
  </div>`;

  // Poblar selects
  const fs=document.getElementById(`vfrom-${b}`);
  const ts=document.getElementById(`vto-${b}`);
  allFechas.forEach(f=>{
    const lbl=fmtF(f);
    fs.innerHTML+=`<option value="${f}">${lbl}</option>`;
    ts.innerHTML+=`<option value="${f}">${lbl}</option>`;
  });
  if(prevFrom && allFechas.includes(prevFrom)) fs.value=prevFrom;
  if(prevTo   && allFechas.includes(prevTo))   ts.value=prevTo;
  else ts.selectedIndex=allFechas.length-1;

  // Chart
  if(charts[b]) charts[b].destroy();
  const ctx=document.getElementById(`vchart-${b}`).getContext('2d');
  charts[b]=new Chart(ctx,{
    type:'line',
    data:{labels:[],datasets:[
      {label:'Sensor 1',data:[],borderColor:'#3266ad',backgroundColor:'rgba(50,102,173,0.07)',borderWidth:1.8,pointRadius:1.5,pointHoverRadius:5,fill:false,tension:0.3},
      {label:'Sensor 2',data:[],borderColor:'#e07b2a',backgroundColor:'rgba(224,123,42,0.07)',borderWidth:1.8,pointRadius:1.5,pointHoverRadius:5,fill:false,tension:0.3},
      {label:`Máx ${T_MAX}°C`,data:[],borderColor:'#E24B4A',borderWidth:1.5,borderDash:[6,4],pointRadius:0,fill:false},
      {label:`Mín ${T_MIN}°C`,data:[],borderColor:'#185FA5',borderWidth:1.5,borderDash:[6,4],pointRadius:0,fill:false}
    ]},
    options:{
      responsive:true,maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{display:false},
        tooltip:{callbacks:{
          label:item=>{
            const names=['Sensor 1','Sensor 2','Máx','Mín'];
            return` ${names[item.datasetIndex]}: ${item.raw!==null?item.raw.toFixed(1)+'°C':'sin dato'}`;
          }
        }}
      },
      scales:{
        x:{ticks:{font:{size:10},color:'#6b6a64',maxRotation:45,autoSkip:true,maxTicksLimit:18},grid:{color:'rgba(0,0,0,.07)'}},
        y:{min:Y_MIN,max:Y_MAX,ticks:{stepSize:1,callback:v=>v+'°C',font:{size:11},color:'#6b6a64'},grid:{color:'rgba(0,0,0,.07)'}}
      }
    }
  });

  function update(){
    const fi=allFechas.indexOf(fs.value), ti=allFechas.indexOf(ts.value);
    const [a,lo]=fi<=ti?[fi,ti]:[ti,fi];
    const inRange=r=>{const i=allFechas.indexOf(r.fecha);return i>=a&&i<=lo;};
    const fd1=d1.filter(inRange), fd2=d2.filter(inRange);

    // Labels unificados por timestamp
    const allPts=[...fd1.map(r=>({t:r.ts,lbl:fmtF(r.fecha)+' '+r.hora})),
                  ...fd2.map(r=>({t:r.ts,lbl:fmtF(r.fecha)+' '+r.hora}))]
      .sort((a,c)=>a.t-c.t);
    const uniqTs=[...new Map(allPts.map(p=>[p.t,p])).values()];
    const labels=uniqTs.map(p=>p.lbl);

    // Mapas ts→temp
    const m1=new Map(fd1.map(r=>[r.ts,r.temp]));
    const m2=new Map(fd2.map(r=>[r.ts,r.temp]));
    const arr1=uniqTs.map(p=>m1.has(p.t)?m1.get(p.t):null);
    const arr2=uniqTs.map(p=>m2.has(p.t)?m2.get(p.t):null);
    const n=uniqTs.length;

    charts[b].data.labels=labels;
    charts[b].data.datasets[0].data=arr1;
    charts[b].data.datasets[1].data=arr2;
    charts[b].data.datasets[2].data=new Array(n).fill(T_MAX);
    charts[b].data.datasets[3].data=new Array(n).fill(T_MIN);
    charts[b].options.spanGaps=true;
    charts[b].update();

    // Métricas S1
    if(fd1.length){
      const v1=fd1.map(r=>r.temp);
      document.getElementById(`min-${b}-s1`).textContent=Math.min(...v1).toFixed(1)+'°C';
      document.getElementById(`max-${b}-s1`).textContent=Math.max(...v1).toFixed(1)+'°C';
      document.getElementById(`avg-${b}-s1`).textContent=(v1.reduce((s,v)=>s+v,0)/v1.length).toFixed(1)+'°C';
    }
    // Métricas S2
    if(fd2.length){
      const v2=fd2.map(r=>r.temp);
      document.getElementById(`min-${b}-s2`).textContent=Math.min(...v2).toFixed(1)+'°C';
      document.getElementById(`max-${b}-s2`).textContent=Math.max(...v2).toFixed(1)+'°C';
      document.getElementById(`avg-${b}-s2`).textContent=(v2.reduce((s,v)=>s+v,0)/v2.length).toFixed(1)+'°C';
    }

    document.getElementById(`csub-${b}`).textContent=
      `Bodega #${num} · ${fmtF(allFechas[a])} → ${fmtF(allFechas[lo])} · S1: ${fd1.length} lecturas · S2: ${fd2.length} lecturas`;

    // Rango
    if(uniqTs.length){
      document.getElementById(`vrl-${b}`).textContent=
        '⏱  '+labels[0]+'  →  '+labels[labels.length-1];
    }

    renderTabla(b,'s1',fd1);
    renderTabla(b,'s2',fd2);
  }
  fs.addEventListener('change',update);
  ts.addEventListener('change',update);
  update();
}

function renderTabla(b,s,data){
  const el=document.getElementById(`twrap-${b}-${s}`);
  if(!el)return;
  if(!data.length){el.innerHTML='<p style="padding:16px;text-align:center;color:#5d6d7e;font-size:13px;">Sin datos para este rango</p>';return;}
  el.innerHTML=`<table>
    <thead><tr><th>No.</th><th>Fecha</th><th>Hora</th><th>Temp.</th><th>Humedad</th><th>Inspector</th><th>Observaciones</th></tr></thead>
    <tbody>${data.map(r=>`<tr>
      <td>${r.no}</td><td>${fmtF(r.fecha)}</td><td>${r.hora}</td>
      <td><span class="badge badge-t">${r.temp}°C</span></td>
      <td><span class="badge badge-h">${r.humi?r.humi+'%':'—'}</span></td>
      <td style="color:#1a5276;font-weight:600;">${r.inspector||'—'}</td>
      <td style="color:#6b6a64;font-size:12px;">${r.obs||''}</td>
    </tr>`).join('')}</tbody>
  </table>`;
}

function switchTbl(b,s){
  ['s1','s2'].forEach(x=>{
    document.getElementById(`ttab-${b}-${x}`).className='tab-tbl';
    document.getElementById(`tpanel-${b}-${x}`).classList.remove('active');
  });
  document.getElementById(`ttab-${b}-${s}`).classList.add(`active-${s}`);
  document.getElementById(`tpanel-${b}-${s}`).classList.add('active');
}
</script>
</body>
</html>
